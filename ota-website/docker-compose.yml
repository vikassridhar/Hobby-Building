version: '3.8'

services:
  ota-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ota-website
    ports:
      - "3001:3001"  # Proxy API server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LLM_URL=http://host.docker.internal:8000/v1/chat/completions
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ota-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for serving static files
  nginx:
    image: nginx:alpine
    container_name: ota-nginx
    ports:
      - "8080:80"  # Website frontend
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ota-website
    networks:
      - ota-network
    restart: unless-stopped

networks:
  ota-network:
    driver: bridge
